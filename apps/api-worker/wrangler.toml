name = "luotdi-api"
main = "src/index.ts"
compatibility_date = "2025-10-11"
compatibility_flags = ["nodejs_compat"]

# 04:00 AM Asia/Ho_Chi_Minh (UTC+7) — nightly seq reset + hold sweeper
[triggers]
crons = ["0 21 * * *"]

[vars]
# Deployed default: dev login OFF. Local `wrangler dev` overrides this with
# ENVIRONMENT=dev from .dev.vars (created from .dev.vars.example by `pnpm dev`).
ENVIRONMENT = "production"

# Secrets — set with `wrangler secret put <NAME>` (locally: .dev.vars, git-ignored):
#   ZALO_APP_SECRET              Zalo App secret (appsecret_proof for graph.zalo.me)
#   JWT_SECRET                   HS256 key for guest JWTs (>= 32 random bytes)
#   ZALO_OA_ACCESS_TOKEN         OA access token for ZNS (expires; rotate)
#   ZNS_TEMPLATE_APPROACHING_ID  approved ZNS template id ("approaching turn")
#   ZNS_DEVELOPMENT_MODE         optional, "1" = send ZNS with mode=development

[[d1_databases]]
binding = "DB"
database_name = "luotdi-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[durable_objects]
bindings = [
  { name = "BRANCH_QUEUE_ROOM", class_name = "BranchQueueRoom" }
]

[[migrations]]
tag = "v1"
new_classes = ["BranchQueueRoom"]
