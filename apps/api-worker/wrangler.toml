name = "luotdi-api"
main = "src/index.ts"
compatibility_date = "2025-10-11"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "luotdi-db"
database_id = "00000000-0000-0000-0000-000000000000"

[durable_objects]
bindings = [
  { name = "BRANCH_QUEUE_ROOM", class_name = "BranchQueueRoom" }
]

[[migrations]]
tag = "v1"
new_classes = ["BranchQueueRoom"]
